<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B201A">
<title>Prototype</title>
<style>
  :root { --fond: #F6F7F4; --texte: #1B201A; --second: #434A41; --trait: #8C948A; --fort: #1E5631; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1B201A; color: var(--texte);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #sommaire { min-height: 100%; background: var(--fond); padding: 24px 16px 48px; }
  #sommaire > div { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--second); margin: 28px 0 8px; }
  p.aide { color: var(--second); margin: 0 0 8px; font-size: 15px; }
  button.parcours { display: block; width: 100%; text-align: left; min-height: 56px; margin: 8px 0;
    padding: 14px 16px; font: inherit; font-weight: 600; color: var(--texte); background: #fff;
    border: 1px solid var(--trait); border-radius: 10px; cursor: pointer; }
  button.parcours small { display: block; font-weight: 400; color: var(--second); font-size: 14px; }
  #scene { position: fixed; inset: 0; overflow: auto; display: none; background: #1B201A; }
  #cadre { position: relative; margin: 0 auto; overflow: hidden; background: var(--fond); }
  .couche { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .couche img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .zone { position: absolute; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; }
  .zone:focus-visible { outline: 3px solid #1F4FA8; outline-offset: 1px; }
  .indices .zone { animation: indice .6s ease-out; }
  @keyframes indice { from { background: rgba(31,79,168,.28); } to { background: transparent; } }
  .voile { position: absolute; inset: 0; }
  #menu { position: fixed; top: max(4px, env(safe-area-inset-top)); left: 4px; z-index: 10; width: 30px; height: 30px;
    border-radius: 15px; border: 0; background: rgba(27,32,26,.35); color: #fff; font-size: 16px; cursor: pointer; }
  #menu.bas { top: auto; bottom: 8px; left: 8px; width: 40px; height: 40px; border-radius: 20px; background: rgba(27,32,26,.6); }
</style>
</head>
<body>
<main id="sommaire"><div>
  <h1>Prototype</h1>
  <p class="aide">Une maquette, pas l'application : les données sont fictives et rien ne s'enregistre.</p>
  <p class="aide">Touche les boutons comme dans la vraie application. Le bouton rond en haut à gauche revient ici.</p>
  <div id="liste"></div>
</div></main>
<div id="scene"><div id="cadre"></div></div>
<button id="menu" type="button" aria-label="Revenir au sommaire" hidden>≡</button>
<script>
"use strict";
const D = /*DONNEES*/null;
const E = D.ecrans;
const indices = new URLSearchParams(location.search).has("indices");
const scene = document.getElementById("scene"), cadre = document.getElementById("cadre");
const menu = document.getElementById("menu");
let vars = {}, histoire = [], base = null, superpositions = [], echelle = 1;

function libelle(nom) {   // « Interface · Vague 1 — terrain (P1 et P2) » → titre et précision
  const [titre, ...reste] = nom.replace(/^Interface · /, "").split(" — ");
  return [titre, reste.join(" — ")];
}

function sommaire() {
  const liste = document.getElementById("liste");
  liste.textContent = "";
  for (const page of [...new Set(D.parcours.map(p => p.page))]) {
    const h = document.createElement("h2");
    h.textContent = page.includes("terrain") ? "Au jardin, sur le téléphone" : "Au bureau, sur l'ordinateur";
    liste.append(h);
    for (const p of D.parcours.filter(q => q.page === page)) {
      const [titre, precision] = libelle(p.nom);
      const b = document.createElement("button");
      b.className = "parcours"; b.type = "button";
      b.innerHTML = `<small></small>`;
      b.prepend(precision || titre);
      b.querySelector("small").textContent = (precision ? titre + " · " : "") + E[p.depart].nom;
      b.onclick = () => demarrer(p.depart);
      liste.append(b);
    }
  }
}

function demarrer(id) {
  vars = structuredClone(D.variables);
  histoire = []; superpositions = []; base = id;
  document.getElementById("sommaire").style.display = "none";
  scene.style.display = "block"; menu.hidden = false;
  history.replaceState(null, "", "#" + id);
  dessiner();
}

function quitter() {
  scene.style.display = "none"; menu.hidden = true;
  document.getElementById("sommaire").style.display = "";
  history.replaceState(null, "", location.pathname + location.search);
}

function image(e) {
  return e.variable ? (e.images[vars[e.variable]] || e.images[""]) : e.images[""];
}

// Un écran de téléphone tient en entier dans la fenêtre ; un écran de bureau prend la largeur.
function mesurer() {
  const e = E[base], W = innerWidth, H = innerHeight;
  echelle = e.l <= 500 ? Math.min(W / e.l, H / e.h) : Math.min(W / e.l, 1);
  cadre.style.width = e.l * echelle + "px";
  cadre.style.height = e.h * echelle + "px";
  cadre.style.marginTop = e.l <= 500 ? Math.max(0, (H - e.h * echelle) / 2) + "px" : "0";
  menu.classList.toggle("bas", e.l > 500);   // en haut, il couvrirait le logo de l'écran de bureau
}

function couche(id, x, y) {
  const e = E[id], c = document.createElement("div");
  c.className = "couche";
  Object.assign(c.style, { left: x * echelle + "px", top: y * echelle + "px",
    width: e.l * echelle + "px", height: e.h * echelle + "px" });
  const img = document.createElement("img");
  img.src = image(e); img.alt = e.nom; img.draggable = false;
  c.append(img);
  for (const z of e.zones) {
    const b = document.createElement("button");
    b.className = "zone"; b.type = "button"; b.setAttribute("aria-label", z.nom.replace(/^.* · /, ""));
    Object.assign(b.style, { left: z.x * echelle + "px", top: z.y * echelle + "px",
      width: z.l * echelle + "px", height: z.h * echelle + "px" });
    b.onclick = ev => { ev.stopPropagation(); jouer(z.interactions, id); };
    c.append(b);
  }
  c.onclick = () => { if (indices) { c.classList.remove("indices"); void c.offsetWidth; c.classList.add("indices"); } };
  return c;
}

function position(s) {
  const b = E[base], e = E[s.id];
  const cx = (b.l - e.l) / 2, cy = (b.h - e.h) / 2;
  return { bottomCenter: [cx, b.h - e.h], topCenter: [cx, 0], center: [cx, cy],
           topLeft: [0, 0], topRight: [b.l - e.l, 0], bottomLeft: [0, b.h - e.h],
           bottomRight: [b.l - e.l, b.h - e.h] }[s.position] || [cx, cy];
}

function dessiner(transition, arriere) {
  mesurer();
  cadre.textContent = "";
  const fond = couche(base, 0, 0);
  cadre.append(fond);
  let derniere = fond;
  for (const s of superpositions) {
    const v = document.createElement("div");
    v.className = "voile";
    const f = s.fond;
    if (f) v.style.background = `rgba(${f.r * 255},${f.g * 255},${f.b * 255},${f.a})`;
    if (s.horsFerme !== false) v.onclick = () => { superpositions.pop(); dessiner(); };
    cadre.append(v);
    const [x, y] = position(s);
    derniere = couche(s.id, x, y);
    cadre.append(derniere);
  }
  animer(derniere, transition, arriere);
  if (!superpositions.length) scene.scrollTo(0, 0);
}

function animer(el, t, arriere) {
  if (!t || t.type === "instant" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const d = { left: [100, 0], right: [-100, 0], top: [0, 100], bottom: [0, -100] }[t.direction] || [100, 0];
  const sens = arriere ? -1 : 1;
  const depart = t.type === "dissolve" ? { opacity: 0 }
    : { transform: `translate(${d[0] * sens}%, ${d[1] * sens}%)` };
  const fin = t.type === "dissolve" ? { opacity: 1 } : { transform: "translate(0, 0)" };
  el.animate([depart, fin], { duration: 220, easing: "ease-out" });
}

function valeur(v) {
  if (v && v.type === "alias") return vars[v.value];
  return v && "value" in v ? v.value : v;
}

function jouer(interactions, source) {
  for (const it of interactions) {
    if (it.trigger.type !== "onClick") continue;
    executer(it.actions, it.transition, source);
  }
}

function executer(actions, transition, source) {
  for (const a of actions) {
    if (a.type === "navigate") {
      if (superpositions.length) superpositions = [];   // naviguer depuis une superposition la ferme
      histoire.push(base); base = a.dest;
      history.replaceState(null, "", "#" + base);
      dessiner(transition);
    } else if (a.type === "back") {
      if (superpositions.length) superpositions.pop();
      else if (histoire.length) base = histoire.pop();
      history.replaceState(null, "", "#" + base);
      dessiner(transition, true);
    } else if (a.type === "openOverlay") {
      superpositions.push({ id: a.dest, position: a.position, fond: a.background, horsFerme: a.close_on_outside });
      dessiner(transition);
    } else if (a.type === "closeOverlay") {
      superpositions.pop();
      dessiner();
    } else if (a.type === "setVariable") {
      vars[a.variable] = "value" in a ? a.value : vars[a.variable];
      dessiner();
    } else if (a.type === "conditional") {
      for (const bloc of a.blocks) {
        if (!bloc.condition || valeur(bloc.condition.value)) { executer(bloc.actions, transition, source); break; }
      }
    } else {
      console.warn("Action non jouée par le lecteur :", a.type);
    }
  }
}

menu.onclick = quitter;
addEventListener("keydown", ev => { if (ev.key === "Escape") quitter(); });
addEventListener("resize", () => { if (base !== null && scene.style.display === "block") dessiner(); });
sommaire();
const depuis = Number(location.hash.slice(1));
if (E[depuis]) demarrer(depuis);
</script>
</body>
</html>
